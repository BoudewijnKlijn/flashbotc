<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotC Flashcards</title>
<style>
  :root {
    --townsfolk: #2b6cb0;
    --outsider: #2c7a7b;
    --minion: #c05621;
    --demon: #c53030;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1a202c;
    color: #f7fafc;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 1.4rem; margin: 0 0 20px; text-align: center; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; width: min(90vw, 460px); }
  select, button {
    font: inherit;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #4a5568;
    background: #2d3748;
    color: #f7fafc;
    cursor: pointer;
  }
  button:hover, select:hover { background: #4a5568; }
  .card {
    width: min(90vw, 460px);
    min-height: 280px;
    background: #2d3748;
    border-radius: 16px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    border-top: 6px solid #4a5568;
    user-select: none;
    transition: transform .08s;
  }
  .card:active { transform: scale(.99); }
  .badge {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff;
    margin-bottom: 16px;
  }
  .name { font-size: 1.8rem; font-weight: 700; }
  .ability { font-size: 1.15rem; line-height: 1.5; color: #e2e8f0; }
  .hint { color: #718096; font-size: .8rem; margin-top: 20px; }
  .nav { display: flex; gap: 12px; margin-top: 18px; align-items: center; }
  .progress { color: #a0aec0; font-size: .9rem; min-width: 70px; text-align: center; }

  /* On phones: full-width, thumb-friendly controls */
  @media (max-width: 480px) {
    h1 { font-size: 1.2rem; }
    .controls > * { flex: 1 1 100%; padding: 12px 14px; text-align: center; }
    .nav button { padding: 12px 18px; }
  }
</style>
</head>
<body>
  <h1>Blood on the Clocktower — Flashcards</h1>

  <div class="controls">
    <select id="scriptFilter"></select>
    <select id="typeFilter"></select>
    <button id="modeToggle">🔤 Name → ability</button>
    <button id="orderToggle">📋 In order</button>
  </div>

  <div class="card" id="card" onclick="flip()">
    <div class="badge" id="badge"></div>
    <div id="front"></div>
    <div id="back" style="display:none"></div>
    <div class="hint" id="hint">Tap card to flip</div>
  </div>

  <div class="nav">
    <button onclick="prev()">← Prev</button>
    <span class="progress" id="progress"></span>
    <button onclick="next()">Next →</button>
  </div>

<script>

      {"name": "Politician", "ability": "If you were the player most responsible for your team losing, you change alignment & win, even if dead."},
      {"name": "Puzzlemaster", "ability": "1 player is drunk, even if you die. If you guess (once) who it is, learn the Demon player, but guess wrong & get false info."},
      {"name": "Recluse", "ability": "You might register as evil & as a Minion or Demon, even if dead."},
      {"name": "Saint", "ability": "If you die by execution, your team loses."},
      {"name": "Snitch", "ability": "Each Minion gets 3 bluffs."},
      {"name": "Sweetheart", "ability": "When you die, 1 player is drunk from now on."},
      {"name": "Tinker", "ability": "You might die at any time."},

    ],
    "Minion": [
      {"name": "Assassin", "ability": "Once per game, at night*, choose a player: they die, even if for some reason they could not."},
      {"name": "Baron", "ability": "There are extra Outsiders in play. [+2 Outsiders]"},

      {"name": "Mastermind", "ability": "If the Demon dies by execution (ending the game), play for 1 more day. If a player is then executed, their team loses."},

      {"name": "Spy", "ability": "Each night, you see the Grimoire. You might register as good & as a Townsfolk or Outsider, even if dead."},
      {"name": "Summoner", "ability": "You get 3 bluffs. On the 3rd night, choose a player: they become an evil Demon of your choice. [No Demon]"},
      {"name": "Vizier", "ability": "All players know you are the Vizier. You cannot die during the day. If good voted, you may choose to execute immediately."},

      {"name": "Wizard", "ability": "Once per game, choose to make a wish. If granted, it might have a price & leave a clue as to its nature."},

    "Demon": [

const colors = {
  Townsfolk: 'var(--townsfolk)', Outsider: 'var(--outsider)',
  Minion: 'var(--minion)', Demon: 'var(--demon)'
};

// Official base-edition character lists
const SCRIPTS = {
  "All characters": null, // null = no script filter
  "Trouble Brewing": ["Washerwoman","Librarian","Investigator","Chef","Empath","Fortune Teller","Undertaker","Monk","Ravenkeeper","Virgin","Slayer","Soldier","Mayor","Butler","Drunk","Recluse","Saint","Poisoner","Spy","Scarlet Woman","Baron","Imp"],
  "Bad Moon Rising": ["Grandmother","Sailor","Chambermaid","Exorcist","Innkeeper","Gambler","Gossip","Courtier","Professor","Minstrel","Tea Lady","Pacifist","Fool","Goon","Lunatic","Tinker","Moonchild","Godfather","Devil's Advocate","Assassin","Mastermind","Zombuul","Pukka","Shabaloth","Po"],
  "Sects & Violets": ["Clockmaker","Dreamer","Snake Charmer","Mathematician","Flowergirl","Town Crier","Oracle","Savant","Seamstress","Philosopher","Artist","Juggler","Sage","Mutant","Sweetheart","Barber","Klutz","Evil Twin","Witch","Cerenovus","Pit-Hag","Fang Gu","Vigormortis","No Dashii","Vortox"]
};

// Flatten characters with their type
const all = [];
for (const [type, chars] of Object.entries(DATA.characters)) {
  for (const c of chars) all.push({ ...c, type });
}

let deck = [];
let idx = 0;
let flipped = false;
let ordered = true; // true = team/alphabetical order, false = shuffled
let showName = true; // true = show name, guess ability; false = the reverse

// Build script filter
const scriptFilter = document.getElementById('scriptFilter');
scriptFilter.innerHTML = Object.entries(SCRIPTS)
  .map(([name, list]) => {
    const count = list ? list.length : all.length;
    return `<option value="${name}">${name} (${count})</option>`;
  })
  .join('');

// Build type filter
const filter = document.getElementById('typeFilter');
filter.innerHTML = '<option value="All">All types</option>' +
  Object.keys(DATA.characters)
    .map(t => `<option value="${t}">${t}</option>`)
    .join('');

function buildDeck() {
  const scriptList = SCRIPTS[scriptFilter.value]; // null = all characters
  const t = filter.value;
  deck = all.filter(c =>
    (scriptList === null || scriptList.includes(c.name)) &&
    (t === 'All' || c.type === t)
  );
  if (!ordered) shuffleDeck();
  idx = 0;
  flipped = false;
  render();
}

// Fisher–Yates permutation of the current deck, in place
function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
}

function toggleOrder() {
  ordered = !ordered;
  document.getElementById('orderToggle').textContent = ordered ? '📋 In order' : '🔀 Shuffle';
  buildDeck();
}

function toggleMode() {
  showName = !showName;
  document.getElementById('modeToggle').textContent = showName ? '🔤 Name → ability' : '📖 Ability → name';
  flipped = false;
  render();
}

function flip() { flipped = !flipped; render(); }
function next() { idx = (idx + 1) % deck.length; flipped = false; render(); }
function prev() { idx = (idx - 1 + deck.length) % deck.length; flipped = false; render(); }

function render() {
  if (deck.length === 0) {
    document.getElementById('badge').textContent = '';
    document.getElementById('front').innerHTML = '<div class="ability">No characters of this type in this script.</div>';
    document.getElementById('back').innerHTML = '';
    document.getElementById('hint').textContent = '';
    document.getElementById('progress').textContent = '0 / 0';
    return;
  }
  const c = deck[idx];
  const card = document.getElementById('card');
  const badge = document.getElementById('badge');
  const front = document.getElementById('front');
  const back = document.getElementById('back');

  badge.textContent = c.type;
  badge.style.background = colors[c.type] || '#4a5568';
  card.style.borderTopColor = colors[c.type] || '#4a5568';

  const nameHtml = `<div class="name">${c.name}</div>`;
  const abilityHtml = `<div class="ability">${c.ability}</div>`;

  // Front = prompt side, Back = answer side
  const promptHtml = showName ? nameHtml : abilityHtml;
  const answerHtml = showName ? abilityHtml : nameHtml;

  front.style.display = flipped ? 'none' : 'block';
  back.style.display = flipped ? 'block' : 'none';
  front.innerHTML = promptHtml;
  back.innerHTML = answerHtml;

  document.getElementById('hint').textContent = flipped ? 'Tap to hide' : 'Tap to reveal';
  document.getElementById('progress').textContent = `${idx + 1} / ${deck.length}`;
}

scriptFilter.addEventListener('change', buildDeck);
filter.addEventListener('change', buildDeck);
document.getElementById('modeToggle').addEventListener('click', toggleMode);
document.getElementById('orderToggle').addEventListener('click', toggleOrder);

// Keyboard: space/enter flip, arrows navigate
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
});

buildDeck();
</script>
</body>
</html>
